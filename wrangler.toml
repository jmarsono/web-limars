name = "web"
main = ".open-next/worker.js"
compatibility_date = "2026-06-15"
compatibility_flags = [ "nodejs_compat", "enable_nodejs_sqlite_module" ]

workers_dev = true

find_additional_modules = true

[[rules]]
type = "ESModule"
globs = [
  "server-functions/default/handler.mjs",
  "middleware/handler.mjs",
  "middleware/open-next.config.mjs",
  "cloudflare/*.js",
  "cloudflare/*.mjs",
  ".build/durable-objects/*.js"
]
fallthrough = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "limars-db"
database_id = "d35a7fa9-7d5f-46a7-8275-658eacc94c9b"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "limars-media"
