name: GSC Monitor

on:
  # Manual trigger — run on demand
  workflow_dispatch:
  # Weekly report every Monday 08:00 UTC (15:00 WIB)
  schedule:
    - cron: "0 8 * * 1"

jobs:
  monitor:
    name: Submit sitemap & fetch analytics
    runs-on: ubuntu-latest
    environment:
      name: Auto Deploy To Cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run GSC monitor
        env:
          GCP_SERVICE_ACCOUNT_KEY_B64: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_B64 }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY || 'sc-domain:limarsteknik.com' }}
          GSC_SITEMAP_URL: https://limarsteknik.com/sitemap.xml
        run: |
          python scripts/gsc-monitor.py | tee "$GITHUB_STEP_SUMMARY"
